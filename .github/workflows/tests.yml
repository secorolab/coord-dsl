# SPDX-License-Identifier: MPL-2.0
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install rdf-utils (git dependency)
        run: pip install "rdf_utils @ git+https://github.com/minhnh/rdf-utils.git"

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
