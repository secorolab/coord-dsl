[project]
name = "coord_dsl"
dynamic = ["version"]
description = "A Domain-Specific Language (DSL) to execute simple coordination models."
authors = [{ name = "", email = "vamsi.kalagautur@uni-bremen.de" }]
license = { text = "MIT" }
keywords = [""]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textX>=4.1.0",
    "textx_ls_core",
    "jinja2",
    "rdflib>=7.6.0",
    "rdf_utils",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "furo",
]

[project.urls]
"Homepage" = "https://github.com/secorolab/coord-dsl"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project.entry-points.textx_languages]
fsm = "coord_dsl.registration:fsm_lang"

[project.entry-points."textx_generators"]
fsm_graph_console = "coord_dsl.registration:fsm_console_gen"
fsm_graph_file = "coord_dsl.registration:fsm_file_gen"
fsm_dot = "coord_dsl.registration:fsm_dot_gen"
fsm_dot_console = "coord_dsl.registration:fsm_dot_console_gen"
fsm_cpp = "coord_dsl.registration:fsm_cpp_gen"
fsm_python = "coord_dsl.registration:fsm_python_gen"

[ruff]
line-length = 100
